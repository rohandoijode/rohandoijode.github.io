<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rohan Doijode</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="h-full flex flex-col bg-gradient-to-br from-gray-50 via-white to-gray-100 text-gray-800 font-sans">

  <!-- Navbar -->
  <div data-include="components/navbar.html"></div>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-6 py-16 text-center">
    <h1 class="text-5xl font-extrabold mb-6 text-gray-900 tracking-tight transition-all duration-500 hover:scale-105">
      Welcome to <span class="text-indigo-500">Rohan Codes</span> ✨
    </h1>
    <p class="text-lg text-gray-600 max-w-2xl mx-auto leading-relaxed">
      Dive into my world of <span class="font-medium text-indigo-500">projects</span>, 
      <span class="font-medium text-green-500">travel adventures</span>, 
      and <span class="font-medium text-pink-500">guitar chord collections</span>.
    </p>

    <div class="mt-10 flex flex-wrap justify-center gap-4">
      <a href="#projects" class="px-6 py-3 bg-indigo-500 text-white rounded-full shadow-md hover:bg-indigo-600 transition-all duration-300">
        Explore Projects 🚀
      </a>
      <a href="#travel" class="px-6 py-3 bg-green-500 text-white rounded-full shadow-md hover:bg-green-600 transition-all duration-300">
        Travel Stories 🌏
      </a>
      <a href="#music" class="px-6 py-3 bg-pink-500 text-white rounded-full shadow-md hover:bg-pink-600 transition-all duration-300">
        Guitar Chords 🎸
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-4 text-center">
    <div data-include="components/footer.html"></div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
